<!-- Slate's mark: the week as a grid, with one cell lit for "now". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Slate">
  <rect width="32" height="32" rx="8" fill="#15181D"/>
  <g stroke="#3A3F48" stroke-width="1.25" stroke-linecap="round">
    <path d="M6 12h20M6 18h20M6 24h20"/>
    <path d="M12 8v18M19 8v18"/>
  </g>
  <rect x="19" y="12" width="7" height="6" fill="#E09112"/>
  <rect x="6" y="6" width="20" height="2.5" rx="1.25" fill="#F6F4EF"/>
</svg>
